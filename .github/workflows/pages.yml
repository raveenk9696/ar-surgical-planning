name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # weekly run: relay probe and rebuild

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  # Reviewed skin crop (pipeline/validation.md, 2026-10-31). The pipeline owns this value.
  CROP_Z_MIN: '-350'

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v6 # public TCIA series; fetch_sample.py still SHA256-checks all 189 files
        with:
          path: data/abdomen
          key: tcia-abdomen-${{ hashFiles('pipeline/samples.json') }}
      - run: |
          mkdir -p build
          python pipeline/fetch_sample.py abdomen
          MPLBACKEND=Agg python pipeline/surfaces.py data/abdomen build/abdomen.raw.glb --crop-z-min="$CROP_Z_MIN"
      - run: npm ci && npm run typecheck && npm test
        working-directory: web
      - run: node scripts/pack-model.mjs ../build/abdomen.raw.glb public/models # full and lite; the raw file never enters dist
        working-directory: web
      - run: npm run probe:relays # blocks only the weekly run: on pushes a relay outage must not stop a fix
        working-directory: web
        continue-on-error: ${{ github.event_name != 'schedule' }}
      - run: npm run build && SMOKE_REQUIRE_MODEL=1 npm run smoke
        working-directory: web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - run: python tools/publish_check.py

  deploy:
    needs: [build, publish-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
