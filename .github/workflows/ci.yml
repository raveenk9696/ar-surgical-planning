name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r pipeline/requirements.txt pytest==9.2.0
      - run: pytest -q pipeline/tests pipeline-lite
      - run: |
          mkdir -p build
          python pipeline/fetch_sample.py abdomen
          MPLBACKEND=Agg python pipeline/surfaces.py data/abdomen build/abdomen.raw.glb --crop-z-min=-350
      - run: npm ci && npm test && npm run build
        env:
          AR_MODEL_SRC: ../build/abdomen.raw.glb
        working-directory: web

  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - run: python tools/publish_check.py --deploy .
        if: github.event_name != 'workflow_dispatch'
      - run: python tools/publish_check.py .
        if: github.event_name == 'workflow_dispatch'
